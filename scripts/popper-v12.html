<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#f7f1e5;font-family:Arial,sans-serif;color:#263b73}body{overflow:hidden}
#game{height:100vh;max-width:620px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
#shell{flex:1;min-height:0;border:4px solid #27a8c6;border-radius:28px;background:#fffaf0;box-shadow:inset 0 0 0 5px #eadbb9;padding:10px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
#title{display:flex;justify-content:center;align-items:center;gap:1px;height:42px;line-height:1}.logoLetter{font-weight:1000;font-size:28px;-webkit-text-stroke:2px #4a2b1b;paint-order:stroke fill;filter:drop-shadow(0 2px 0 #4a2b1b55)}.lt{color:#27a8c6}.lr{color:#ef6259}.lb1{color:#f2c94c}.lb2{color:#a9cf32}.ll{color:#27a8c6}.le{color:#ef6259}.logoPop{width:39px;height:39px;border:4px solid #4a2b1b;border-radius:50%;background:#27a8c6;position:relative;display:inline-block;box-shadow:inset 0 5px 0 #ffffff55}.logoPop:before{content:'';position:absolute;left:5px;right:5px;top:2px;height:23px;border-radius:50% 50% 42% 42%;background:linear-gradient(145deg,#fff9,#d9f6ff55);border:2px solid #fff9}.logoPop:after{content:'⚄';position:absolute;inset:5px 0 0;text-align:center;font-size:16px;color:#222;transform:rotate(-10deg)}
#players{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;font-size:12px;font-weight:900}
.player{display:flex;align-items:center;gap:5px;min-width:0}.player.right{justify-content:flex-end}.dot{width:11px;height:11px;border-radius:50%;flex:none}.coral{background:#d85b61}.blue{background:#27a8c6}
#turn{text-align:center;border-radius:12px;background:#f2ead8;padding:4px 8px;min-width:94px}.roll{font-size:15px;color:#4a2b1b}
#boardWrap{display:flex;justify-content:center;min-height:0}
#board{width:min(45vh,100%);aspect-ratio:1;border:3px solid #e0d3bb;border-radius:20px;background:#f7f1df;position:relative;overflow:hidden;box-shadow:inset 0 2px 8px #0001}
.quad{position:absolute;width:50%;height:50%;opacity:.92}.q1{left:0;top:0;background:#27a8c6}.q2{right:0;top:0;background:#d85b61}.q3{right:0;bottom:0;background:#c8d82e}.q4{left:0;bottom:0;background:#f2c94c}
.center{position:absolute;inset:29%;border-radius:50%;background:#fffaf0;border:3px solid #eadbb9;overflow:hidden;z-index:3;touch-action:none}.center canvas{display:block;width:100%!important;height:100%!important}
.track{position:absolute;inset:7%;border:18px dotted #fffaf0;border-radius:28%;z-index:2;filter:drop-shadow(0 0 0 #555)}
.track:after{content:'';position:absolute;inset:-18px;border:18px dotted transparent;border-radius:28%;pointer-events:none}
/* Keep playable spaces visually distinct without crowding the route. */
.track{--space-outline:#555}
#board .track{border-color:#fffaf0;outline:none}
#board .track::before{content:'';position:absolute;inset:-18px;border:18px dotted var(--space-outline);border-radius:28%;z-index:-1;transform:scale(1.015)}
.home{position:absolute;display:grid;grid-template-columns:repeat(2,13px);gap:6px;z-index:4}.home i{width:13px;height:13px;border-radius:50%;background:#fffaf0;border:1px solid #555}.h1{left:12%;top:12%}.h2{right:12%;top:12%}.h3{right:12%;bottom:12%}.h4{left:12%;bottom:12%}
#popperArea{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:#fffaf0}
#stage{position:relative;width:min(80%,35.2vh);aspect-ratio:1;touch-action:none;overflow:visible}#stage canvas{display:block;width:100%!important;height:100%!important}
#hint{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:11px;font-weight:900;letter-spacing:1.2px;color:#263b73;pointer-events:none}
#push{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}#status{display:none}
</style></head><body><main id="game"><section id="shell">
<div id="title" aria-label="Trobble"><span class="logoLetter lt">T</span><span class="logoLetter lr">R</span><span class="logoPop" aria-hidden="true"></span><span class="logoLetter lb1">B</span><span class="logoLetter lb2">B</span><span class="logoLetter ll">L</span><span class="logoLetter le">E</span></div>
<div id="players"><div class="player"><span class="dot coral"></span><span>JOSH&nbsp; ●○○○</span></div><div id="turn">YOUR TURN<div class="roll" id="rollread">🎲 — + — = —</div></div><div class="player right"><span>SARA&nbsp; ●●○○</span><span class="dot blue"></span></div></div>
<div id="boardWrap"><div id="board" aria-label="Four-player race board"><div class="quad q1"></div><div class="quad q2"></div><div class="quad q3"></div><div class="quad q4"></div><div class="track"></div><div class="center" id="miniStage" aria-label="Mini popper mirrors the main popper"></div><div class="home h1"><i></i><i></i><i></i><i></i></div><div class="home h2"><i></i><i></i><i></i><i></i></div><div class="home h3"><i></i><i></i><i></i><i></i></div><div class="home h4"><i></i><i></i><i></i><i></i></div></div></div>
<div id="popperArea"><div id="stage"></div><div id="hint">TAP THE DOME TO POP</div></div>
<button id="push" aria-label="Pop dice"></button><div id="status">Ready</div>
</section></main><script type="module" src="popper-v12.js"></script></body></html>
