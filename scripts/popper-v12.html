<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#efe3ca;font-family:Arial,sans-serif;color:#263b73}body{overflow:hidden}
#game{height:100vh;max-width:620px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
#shell{flex:1;min-height:0;border:4px solid #27a8c6;border-radius:28px;background:#f5ead3;box-shadow:inset 0 0 0 5px #eadbb9;padding:10px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
#title{display:flex;justify-content:center;align-items:center;gap:1px;height:53px;line-height:1}.logoLetter{font-weight:1000;font-size:35px;-webkit-text-stroke:2px #4a2b1b;paint-order:stroke fill;filter:none}.lt{color:#27a8c6}.lr{color:#ef6259}.lb1{color:#f2c94c}.lb2{color:#a9cf32}.ll{color:#27a8c6}.le{color:#ef6259}.logoPop{width:49px;height:49px;position:relative;display:inline-block;border-radius:50%;overflow:hidden}.logoPop:before{content:'';position:absolute;inset:3px;border-radius:50%;background:#b9cfa7;border:3px solid #27a8c6;box-shadow:inset 0 0 0 2px #ef6259}.logoPop:after{content:'';position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 34% 40%,#eadbb9 0 7%,transparent 8%),radial-gradient(circle at 67% 61%,#eadbb9 0 7%,transparent 8%),radial-gradient(circle at 50% 50%,#ffffff66,transparent 64%)}
#players{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;font-size:15.6px;font-weight:900}
.player{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0}.player.right{justify-content:center}.player.right .dot{order:2}.dot{width:11px;height:11px;border-radius:50%;flex:none}.coral{background:#d85b61}.blue{background:#27a8c6}
#turn{text-align:center;border-radius:12px;background:#f2ead8;padding:4px 8px;min-width:94px}.roll{font-size:15px;color:#4a2b1b}
#boardWrap{display:flex;justify-content:center;min-height:0}
#board{width:min(45vh,100%);aspect-ratio:1;border:3px solid #e0d3bb;border-radius:20px;background:#f7f1df;position:relative;overflow:hidden;box-shadow:inset 0 2px 8px #0001}
.quad{position:absolute;width:50%;height:50%;opacity:.92}.q1{left:0;top:0;background:#27a8c6}.q2{right:0;top:0;background:#d85b61}.q3{right:0;bottom:0;background:#c8d82e}.q4{left:0;bottom:0;background:#f2c94c}
.center{position:absolute;inset:31%;border-radius:50%;background:#b9cfa7;border:3px solid #eadbb9;overflow:hidden;z-index:3;touch-action:none}.center canvas{display:block;width:100%!important;height:100%!important}
.track{position:absolute;inset:0;z-index:2}.space{position:absolute;width:7.2%;aspect-ratio:1;border-radius:50%;background:#fffaf0;border:1.5px solid #555;transform:translate(-50%,-50%);box-shadow:0 1px 1px #0002}.space.start.c0{background:#27a8c6}.space.start.c1{background:#d85b61}.space.start.c2{background:#c8d82e}.space.start.c3{background:#f2c94c}.finish{position:absolute;inset:0;z-index:4;pointer-events:none}.finish i{position:absolute;width:6.7%;aspect-ratio:1;border-radius:50%;border:1.5px solid #555;transform:translate(-50%,-50%);box-shadow:inset 0 1px 2px #0002}.finish.c0 i{background:#9edbe8}.finish.c1 i{background:#efa5a8}.finish.c2 i{background:#e2e99a}.finish.c3 i{background:#f7e59a}
.home{position:absolute;display:grid;grid-template-columns:repeat(2,13px);gap:6px;z-index:4}.home i{width:13px;height:13px;border-radius:50%;background:#fffaf0;border:1px solid #555}.h1{left:12%;top:12%}.h2{right:12%;top:12%}.h3{right:12%;bottom:12%}.h4{left:12%;bottom:12%}
#popperArea{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;background:#f5ead3;padding-top:2px}.roll{height:34px;display:flex;align-items:center;justify-content:center}#stage{position:relative;width:min(68%,29.9vh);aspect-ratio:1;touch-action:none;overflow:visible;margin-top:24px}#stage canvas{display:block;width:100%!important;height:100%!important}#rollread{position:relative;z-index:8;background:transparent;padding:0 8px;font-size:25.35px;font-weight:900;color:#4a2b1b;white-space:nowrap}
#push{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}#status{display:none}
</style></head><body><main id="game"><section id="shell">
<div id="title" aria-label="Trobble"><span class="logoLetter lt">T</span><span class="logoLetter lr">R</span><span class="logoPop" id="logoStage" aria-hidden="true"></span><span class="logoLetter lb1">B</span><span class="logoLetter lb2">B</span><span class="logoLetter ll">L</span><span class="logoLetter le">E</span></div>
<div id="players"><div class="player"><span>JOSH</span><span class="dot coral"></span></div><div id="turn">YOUR TURN</div><div class="player right"><span>SARA</span><span class="dot blue"></span></div></div>
<div id="boardWrap"><div id="board" aria-label="Four-player race board"><div class="quad q1"></div><div class="quad q2"></div><div class="quad q3"></div><div class="quad q4"></div><div class="track" id="track"></div><div class="finish c0" id="finish0"></div><div class="finish c1" id="finish1"></div><div class="finish c2" id="finish2"></div><div class="finish c3" id="finish3"></div><div class="center" id="miniStage" aria-label="Mini popper mirrors the main popper"></div><div class="home h1"><i></i><i></i><i></i><i></i></div><div class="home h2"><i></i><i></i><i></i><i></i></div><div class="home h3"><i></i><i></i><i></i><i></i></div><div class="home h4"><i></i><i></i><i></i><i></i></div></div></div>
<div id="popperArea"><div class="roll" id="rollread">🎲 — + — = —</div><div id="stage"></div></div>
<button id="push" aria-label="Pop dice"></button><div id="status">Ready</div>
</section></main><script type="module" src="popper-v12.js"></script></body></html>
