[build]
  command = "unzip -p Scrobble_Mobile_0_1_Capacitor.zip www/icons/scrobble-mascot-v291-512.png > site/mascot.png && python3 -c 'from pathlib import Path; import re; p=Path(\"site/index.html\"); s=p.read_text(); s=re.sub(r\"src=\\\"data:image/jpeg;base64,[^\\\"]+\\\"\", \"src=\\\"/mascot.png\\\"\", s); p.write_text(s)'"
  publish = "site"

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/support"
  to = "/support/"
  status = 301
