workflows:
  scrobble-ios-release:
    name: Scrobble iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yayeverybody.scrobble

    scripts:
      - name: Prepare Scrobble project
        script: |
          unzip -q Scrobble_Mobile_0_1_Capacitor.zip -d scrobble-mobile
          cd scrobble-mobile
          npm install

          python3 - <<'PY'
          from pathlib import Path

          index = Path('www/index.html')
          text = index.read_text()
          text = text.replace(
              'content="width=device-width,initial-scale=1"',
              'content="width=device-width,initial-scale=1,viewport-fit=cover"'
          )
          safe_style = '''
          <style id="scrobble-ios-safe-area">
          @supports (padding: env(safe-area-inset-top)) {
            body.scrobbleGameActive { background:#111 !important; }
            body.scrobbleGameActive #scrobble-v4 { margin-top:env(safe-area-inset-top) !important; }
          }
          </style>
          '''
          if 'id="scrobble-ios-safe-area"' not in text:
              text = text.replace('</head>', safe_style + '</head>')
          index.write_text(text)

          fit = Path('www/viewport-fit-v2670.js')
          js = fit.read_text()
          old = 'const available=Math.max(1,viewportHeight());'
          new = "const safeTop=parseFloat(getComputedStyle(root).marginTop)||0;\n      const available=Math.max(1,viewportHeight()-safeTop);"
          if old in js:
              js = js.replace(old, new)
          fit.write_text(js)

          engine = Path('www/game-engine-v3140.js')
          game = engine.read_text()
          old_hit = "const q=rackEl.getBoundingClientRect(),hit={left:q.left-8,right:q.right+8,top:q.top-18,bottom:q.bottom+18};"
          new_hit = "const q=rackEl.getBoundingClientRect(),hit={left:q.left-18,right:q.right+18,top:q.top-55,bottom:q.bottom+55};"
          if old_hit not in game:
              raise SystemExit('Rack hit-zone patch target not found')
          game = game.replace(old_hit, new_hit, 1)
          engine.write_text(game)

          # Add an in-app account deletion control for Apple App Review.
          # This uses the currently authenticated Supabase client and removes the user's
          # profile/game data first, then invokes a server-side account-delete RPC if present.
          delete_patch = '''
          <style id="scrobble-delete-account-style">
            #scrobble-delete-account-wrap{padding:18px 16px 28px;text-align:center}
            #scrobble-delete-account{background:transparent;border:1px solid #b42318;color:#b42318;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}
          </style>
          <script id="scrobble-delete-account-script">
          (function(){
            function getSupabase(){
              return window.supabaseClient || window.sb || window.supabase || null;
            }
            async function deleteCurrentAccount(){
              const client=getSupabase();
              if(!client || !client.auth){ alert('Account service is unavailable.'); return; }
              if(!confirm('Delete your Yay Everybody account? This permanently deletes your profile and associated game data. This cannot be undone.')) return;
              try{
                const {data:{user}}=await client.auth.getUser();
                if(!user) throw new Error('No signed-in account found.');
                const uid=user.id;
                const tables=['game_players','moves','games','profiles','push_subscriptions'];
                for(const table of tables){
                  try{
                    await client.from(table).delete().or(`user_id.eq.${uid},id.eq.${uid},player_id.eq.${uid},created_by.eq.${uid}`);
                  }catch(e){}
                }
                let rpcError=null;
                try{
                  const r=await client.rpc('delete_user_account');
                  rpcError=r && r.error;
                }catch(e){ rpcError=e; }
                if(rpcError){
                  alert('Your game/profile data was removed, but the authentication record could not be deleted automatically. Please contact support@yayeverybody.com to complete account deletion.');
                  await client.auth.signOut();
                  location.reload();
                  return;
                }
                await client.auth.signOut();
                alert('Your account has been deleted.');
                location.reload();
              }catch(err){
                console.error(err);
                alert('We could not delete your account. Please try again or contact support@yayeverybody.com.');
              }
            }
            function install(){
              if(document.getElementById('scrobble-delete-account')) return;
              const candidates=[...document.querySelectorAll('main,section,div')].filter(el=>/profile|account|settings/i.test((el.id||'')+' '+(el.className||'')));
              const host=candidates[candidates.length-1] || document.body;
              const wrap=document.createElement('div');
              wrap.id='scrobble-delete-account-wrap';
              wrap.innerHTML='<button id="scrobble-delete-account" type="button">Delete Account</button>';
              host.appendChild(wrap);
              document.getElementById('scrobble-delete-account').addEventListener('click',deleteCurrentAccount);
            }
            document.addEventListener('DOMContentLoaded',()=>setTimeout(install,500));
            const obs=new MutationObserver(()=>install());
            obs.observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          '''
          html = index.read_text()
          if 'scrobble-delete-account-script' not in html:
              html = html.replace('</body>', delete_patch + '</body>')
              index.write_text(html)
          PY

          npx cap add ios
          npx cap sync ios

          /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" ios/App/App/Info.plist
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj

          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist

          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          find "$ICONSET" -type f -name '*.png' -delete
          sips -z 1024 1024 www/icons/scrobble-mascot-v291-512.png \
            --out "$ICONSET/AppIcon-1024.png" >/dev/null
          cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD_NUMBER}" ios/App/App/Info.plist

      - name: Set up iOS code signing
        script: |
          cd scrobble-mobile
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd scrobble-mobile
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - scrobble-mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
