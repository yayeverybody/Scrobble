workflows:
  scrobble-ios-release:
    name: Yay Everybody iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yayeverybody.scrobble

    scripts:
      - name: Prepare Yay Everybody project
        script: |
          unzip -q Scrobble_Mobile_0_1_Capacitor.zip -d scrobble-mobile
          cd scrobble-mobile
          npm install
          python3 ../scripts/patch-ios.py
          npx cap add ios
          npx cap sync ios

          # Universal Links entitlement for Scrobble invites.
          cat > ios/App/App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.associated-domains</key>
            <array>
              <string>applinks:yayeverybody.com</string>
            </array>
          </dict>
          </plist>
          PLIST
          # Attach the entitlement only to the native App target build configurations.
          # Do not globally replace every matching bundle-id line in the project file.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ios/App/App.xcodeproj/project.pbxproj")
          s=p.read_text()
          marker="PRODUCT_BUNDLE_IDENTIFIER = com.yayeverybody.scrobble;"
          if marker not in s:
              raise SystemExit("Scrobble bundle identifier not found in Xcode project")
          blocks=s.split("};")
          changed=0
          for i,b in enumerate(blocks):
              if marker in b and "INFOPLIST_FILE = App/Info.plist;" in b:
                  if "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" not in b:
                      b=b.replace(marker, "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;\n\t\t\t\t"+marker)
                      blocks[i]=b
                      changed+=1
          s="};".join(blocks)
          p.write_text(s)
          if changed == 0 and "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" not in s:
              raise SystemExit("Could not attach Associated Domains entitlement to App target")
          print(f"Attached Associated Domains entitlement to {changed} App build configuration(s)")
          PY

          /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" ios/App/App/Info.plist
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj

          # App Store metadata: installed app name must match marketplace name.
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Yay Everybody" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Yay Everybody" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Yay Everybody" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string Yay Everybody" ios/App/App/Info.plist

          # Camera/photo permissions. Missing usage descriptions cause iOS to terminate
          # the app when Take Photo or the photo library is requested.
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Yay Everybody uses the camera when you choose to take a profile photo." ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Yay Everybody uses the camera when you choose to take a profile photo." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription Yay Everybody uses your photo library when you choose a profile photo." ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Yay Everybody uses your photo library when you choose a profile photo." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription Yay Everybody can save a photo only when you choose to do so." ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string Yay Everybody can save a photo only when you choose to do so." ios/App/App/Info.plist

          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist

          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          find "$ICONSET" -type f -name '*.png' -delete
          sips -z 1024 1024 www/icons/scrobble-mascot-v291-512.png \
            --out "$ICONSET/AppIcon-1024.png" >/dev/null
          cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.1" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.1" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD_NUMBER}" ios/App/App/Info.plist

      - name: Set up iOS code signing
        script: |
          cd scrobble-mobile

          # Codemagic's account-level signing store now contains the refreshed
          # Apple Distribution certificate/private key and the newly fetched profile.
          # Install those configured identities; do NOT call fetch-signing-files here,
          # because that can pull Apple's stale pre-Associated-Domains profile again.
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

          # Reject stale profiles. Only keep an App Store profile whose embedded
          # entitlements actually include Associated Domains.
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          GOOD_PROFILE=""
          for p in "$PROFILE_DIR"/*.mobileprovision; do
            [ -e "$p" ] || continue
            security cms -D -i "$p" > /tmp/candidate-profile.plist 2>/dev/null || continue
            APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/candidate-profile.plist 2>/dev/null || true)
            DOMAINS=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.associated-domains" /tmp/candidate-profile.plist 2>/dev/null || true)
            NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/candidate-profile.plist 2>/dev/null || true)
            echo "Candidate profile: $NAME / $APP_ID"
            # Apple distribution profiles may authorize Associated Domains with
            # a wildcard ("*"). The app's signed entitlements below still request
            # only applinks:yayeverybody.com.
            if [ "$APP_ID" = "QX9HW7SCL2.com.yayeverybody.scrobble" ] && { echo "$DOMAINS" | grep -Fq "applinks:yayeverybody.com" || echo "$DOMAINS" | grep -Fq "*"; }; then
              GOOD_PROFILE="$p"
              echo "Using Associated Domains profile: $NAME ($DOMAINS)"
            else
              echo "Rejecting stale/incompatible profile: $NAME"
              rm -f "$p"
            fi
          done
          if [ -z "$GOOD_PROFILE" ] || [ ! -f "$GOOD_PROFILE" ]; then
            echo "ERROR: Apple/Codemagic did not supply a Scrobble App Store profile authorizing Associated Domains."
            echo "Refusing to start Xcode with the stale profile."
            exit 1
          fi
          # The selected profile has now been validated above.

      - name: Diagnose signing configuration
        script: |
          cd scrobble-mobile
          echo "===== APP SIGNING SETTINGS ====="
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -showBuildSettings | \
            grep -E "CODE_SIGN_ENTITLEMENTS|PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM" || true
          echo "===== REQUESTED ENTITLEMENTS ====="
          cat ios/App/App/App.entitlements
          echo "===== INSTALLED PROVISIONING PROFILES ====="
          for p in "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            [ -e "$p" ] || continue
            echo "--- $p ---"
            security cms -D -i "$p" > /tmp/profile.plist 2>/dev/null || continue
            /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.associated-domains" /tmp/profile.plist 2>/dev/null || echo "NO ASSOCIATED DOMAINS IN PROFILE"
          done

      - name: Build signed IPA
        script: |
          cd scrobble-mobile
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

      - name: Verify Universal Links in signed app
        script: |
          cd scrobble-mobile
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*/Build/*/App.app" -type d | head -1)
          test -n "$APP_PATH" || { echo "Signed App.app not found"; exit 1; }
          codesign -d --entitlements :- "$APP_PATH" > /tmp/scrobble-entitlements.plist 2>&1
          cat /tmp/scrobble-entitlements.plist
          grep -q "applinks:yayeverybody.com" /tmp/scrobble-entitlements.plist || {
            echo "ERROR: signed app is missing applinks:yayeverybody.com"
            exit 1
          }

    artifacts:
      - scrobble-mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
