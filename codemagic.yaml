workflows:
  scrobble-ios-release:
    name: Scrobble iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yayeverybody.scrobble

    scripts:
      - name: Prepare Scrobble project
        script: |
          unzip -q Scrobble_Mobile_0_1_Capacitor.zip -d scrobble-mobile
          cd scrobble-mobile
          npm install

          python3 - <<'PY'
          from pathlib import Path

          index = Path('www/index.html')
          text = index.read_text()
          text = text.replace(
              'content="width=device-width,initial-scale=1"',
              'content="width=device-width,initial-scale=1,viewport-fit=cover"'
          )
          safe_style = '''
          <style id="scrobble-ios-safe-area">
          @supports (padding: env(safe-area-inset-top)) {
            body.scrobbleGameActive { background:#111 !important; }
            body.scrobbleGameActive #scrobble-v4 { margin-top:env(safe-area-inset-top) !important; }
          }
          </style>
          '''
          if 'id="scrobble-ios-safe-area"' not in text:
              text = text.replace('</head>', safe_style + '</head>')

          # Put Delete Account in the actual Account modal, directly below Log Out.
          old_logout = '<button id="logoutAccount" class="logoutAccount hidden" type="button">LOG OUT</button>'
          new_logout = old_logout + '<button id="deleteAccount" class="deleteAccount hidden" type="button">DELETE ACCOUNT</button>'
          if old_logout not in text:
              raise SystemExit('Account modal logout button not found')
          text = text.replace(old_logout, new_logout, 1)
          delete_style = '''
          <style id="scrobble-delete-account-style">
          #accountBox .deleteAccount{width:100%;min-height:48px;margin-top:12px;border:1px solid #b42318;border-radius:12px;background:#fff;color:#b42318;font:900 14px Arial,Helvetica,sans-serif}
          #accountBox .deleteAccount.hidden{display:none!important}
          </style>
          '''
          if 'id="scrobble-delete-account-style"' not in text:
              text = text.replace('</head>', delete_style + '</head>')
          index.write_text(text)

          fit = Path('www/viewport-fit-v2670.js')
          js = fit.read_text()
          old = 'const available=Math.max(1,viewportHeight());'
          new = "const safeTop=parseFloat(getComputedStyle(root).marginTop)||0;\n      const available=Math.max(1,viewportHeight()-safeTop);"
          if old in js:
              js = js.replace(old, new)
          fit.write_text(js)

          engine = Path('www/game-engine-v3140.js')
          game = engine.read_text()
          old_hit = "const q=rackEl.getBoundingClientRect(),hit={left:q.left-8,right:q.right+8,top:q.top-18,bottom:q.bottom+18};"
          new_hit = "const q=rackEl.getBoundingClientRect(),hit={left:q.left-18,right:q.right+18,top:q.top-55,bottom:q.bottom+55};"
          if old_hit not in game:
              raise SystemExit('Rack hit-zone patch target not found')
          game = game.replace(old_hit, new_hit, 1)
          engine.write_text(game)

          app = Path('www/app-v3140.js')
          code = app.read_text()
          old_decl = "saveAccountPassword=document.getElementById('saveAccountPassword'),logoutAccount=document.getElementById('logoutAccount'),"
          new_decl = "saveAccountPassword=document.getElementById('saveAccountPassword'),logoutAccount=document.getElementById('logoutAccount'),deleteAccount=document.getElementById('deleteAccount'),"
          if old_decl not in code:
              raise SystemExit('Account element declaration target not found')
          code = code.replace(old_decl, new_decl, 1)

          old_show = "notificationSetupAccount.classList.remove('hidden');\n      logoutAccount.classList.remove('hidden');"
          new_show = "notificationSetupAccount.classList.remove('hidden');\n      logoutAccount.classList.remove('hidden');\n      deleteAccount.classList.remove('hidden');"
          if old_show not in code:
              raise SystemExit('Signed-in account render target not found')
          code = code.replace(old_show, new_show, 1)

          old_hide = "notificationSetupAccount.classList.add('hidden');\n      logoutAccount.classList.add('hidden');"
          new_hide = "notificationSetupAccount.classList.add('hidden');\n      logoutAccount.classList.add('hidden');\n      deleteAccount.classList.add('hidden');"
          if old_hide not in code:
              raise SystemExit('Signed-out account render target not found')
          code = code.replace(old_hide, new_hide, 1)

          logout_block = """  logoutAccount.onclick=async()=>{\n    logoutAccount.disabled=true;\n    logoutAccount.textContent='LOGGING OUT…';\n    try{\n      const {error}=await client.auth.signOut();\n      if(error)throw error;\n      location.reload();\n    }catch(e){\n      alert('Could not log out: '+e.message);\n      logoutAccount.disabled=false;\n      logoutAccount.textContent='LOG OUT';\n    }\n  };\n"""
          delete_block = logout_block + """

  deleteAccount.onclick=async()=>{
    if(!user)return;
    const first=confirm('Delete your Yay Everybody account? This permanently deletes your profile and associated game data. This cannot be undone.');
    if(!first)return;
    const second=confirm('Are you sure? Your account and game history will be permanently deleted.');
    if(!second)return;
    deleteAccount.disabled=true;
    deleteAccount.textContent='DELETING ACCOUNT…';
    try{
      const {error}=await client.rpc('delete_user_account');
      if(error)throw error;
      try{await client.auth.signOut()}catch(e){}
      alert('Your account has been permanently deleted.');
      location.reload();
    }catch(e){
      console.error('Account deletion failed',e);
      alert('We could not delete your account. Nothing else was changed. Please try again.');
      deleteAccount.disabled=false;
      deleteAccount.textContent='DELETE ACCOUNT';
    }
  };
"""
          if logout_block not in code:
              raise SystemExit('Logout handler target not found')
          code = code.replace(logout_block, delete_block, 1)
          app.write_text(code)
          PY

          npx cap add ios
          npx cap sync ios

          /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" ios/App/App/Info.plist
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj

          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist

          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          find "$ICONSET" -type f -name '*.png' -delete
          sips -z 1024 1024 www/icons/scrobble-mascot-v291-512.png \
            --out "$ICONSET/AppIcon-1024.png" >/dev/null
          cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD_NUMBER}" ios/App/App/Info.plist

      - name: Set up iOS code signing
        script: |
          cd scrobble-mobile
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd scrobble-mobile
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - scrobble-mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
