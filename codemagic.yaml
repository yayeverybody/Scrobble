workflows:
  scrobble-ios-release:
    name: Yay Everybody iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yayeverybody.scrobble

    scripts:
      - name: Prepare Yay Everybody project
        script: |
          unzip -q Scrobble_Mobile_0_1_Capacitor.zip -d scrobble-mobile
          cd scrobble-mobile
          npm install
          npm install @capacitor/app @capacitor/share @capacitor/haptics
          python3 -m py_compile ../scripts/patch-ios.py
          python3 ../scripts/patch-ios.py

          # Prove the patched web bundle is the one Capacitor is about to package.
          echo "=== Scrobble patched-auth verification ==="
          grep -q 'id="scrobbleOnboardingV2"' www/index.html || { echo "ERROR: new onboarding missing"; exit 1; }
          grep -q 'id="loginAccountPanel"' www/index.html || { echo "ERROR: login panel missing"; exit 1; }
          grep -q 'id="createAccountPanel"' www/index.html || { echo "ERROR: create panel missing"; exit 1; }
          grep -q 'id="accountIdentity"' www/index.html || { echo "ERROR: original auth profile DOM missing"; exit 1; }
          echo "PATCHED_AUTH_MARKER=AUTH_V4_PRESERVE_DOM"

          npx cap add ios
          npx cap sync ios

          # Prove Capacitor copied that exact patched bundle into the native app.
          grep -q 'id="scrobbleOnboardingV2"' ios/App/App/public/index.html || { echo "ERROR: onboarding not copied to iOS public"; exit 1; }
          grep -q 'id="loginAccountPanel"' ios/App/App/public/index.html || { echo "ERROR: login panel not copied to iOS public"; exit 1; }
          grep -q 'id="accountIdentity"' ios/App/App/public/index.html || { echo "ERROR: original auth profile DOM not copied to iOS"; exit 1; }
          grep -q 'id="playComputerMode"' ios/App/App/public/index.html || { echo "ERROR: approved New Game computer chooser missing"; exit 1; }
          grep -q 'id="startFriendGame"' ios/App/App/public/index.html || { echo "ERROR: approved New Game friend action missing"; exit 1; }
          grep -q 'id="sharedWeirdBox"' ios/App/App/public/index.html || { echo "ERROR: Make It Weird missing"; exit 1; }
          grep -Fq "startFriendGame.onclick=()=>{gameModeBox.classList.add('hidden');createGame()}" ios/App/App/public/app-v3140.js || { echo "ERROR: Share Invite does not call createGame"; exit 1; }
          grep -q 'id="scrobble-haptics"' ios/App/App/public/index.html || { echo "ERROR: haptics bridge not copied to iOS"; exit 1; }
          ! grep -q 'OR PLAY THE COMPUTER' ios/App/App/public/index.html || { echo "ERROR: legacy giant New Game layout survived"; exit 1; }
          echo "IOS_AUTH_MARKER=AUTH_V4_PRESERVE_DOM"
          echo "IOS_NEW_GAME_MARKER=PROGRESSIVE_V2"

          # Universal Links: the App Store build must be signed with Associated
          # Domains enabled for this bundle ID. The matching AASA file must be
          # served by yayeverybody.com.
          cat > ios/App/App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.associated-domains</key>
            <array>
              <string>applinks:yayeverybody.com</string>
              <string>applinks:www.yayeverybody.com</string>
            </array>
          </dict>
          </plist>
          PLIST
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ios/App/App.xcodeproj/project.pbxproj")
          s=p.read_text()
          marker="CODE_SIGN_STYLE = Automatic;"
          if "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" not in s:
              s=s.replace(marker, "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;\n\t\t\t\t"+marker)
          p.write_text(s)
          PY

          /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" ios/App/App/Info.plist
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj

          # App Store metadata: installed app name must match marketplace name.
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Yay Everybody" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Yay Everybody" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Yay Everybody" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string Yay Everybody" ios/App/App/Info.plist

          # Camera/photo permissions. Missing usage descriptions cause iOS to terminate
          # the app when Take Photo or the photo library is requested.
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Yay Everybody uses the camera when you choose to take a profile photo." ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Yay Everybody uses the camera when you choose to take a profile photo." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription Yay Everybody uses your photo library when you choose a profile photo." ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Yay Everybody uses your photo library when you choose a profile photo." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription Yay Everybody can save a photo only when you choose to do so." ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string Yay Everybody can save a photo only when you choose to do so." ios/App/App/Info.plist

          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist

          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          find "$ICONSET" -type f -name '*.png' -delete
          sips -z 1024 1024 www/icons/scrobble-mascot-v291-512.png \
            --out "$ICONSET/AppIcon-1024.png" >/dev/null
          cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          # App Store Connect requires the marketing version to be greater than
          # the the prior TestFlight train so this diagnostic build is unmistakable.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.19" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.18" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD_NUMBER}" ios/App/App/Info.plist

      - name: Verify Associated Domains signing profile
        script: |
          cd scrobble-mobile
          FOUND=""
          PROFILE_COUNT=0
          echo "=== Provisioning profiles available to this build ==="
          for PROFILE in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            [ -f "$PROFILE" ] || continue
            PROFILE_COUNT=$((PROFILE_COUNT + 1))
            PLIST="/tmp/scrobble-profile-$PROFILE_COUNT.plist"
            security cms -D -i "$PROFILE" > "$PLIST"

            NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PLIST" 2>/dev/null || echo "<unknown>")
            UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PLIST" 2>/dev/null || echo "<unknown>")
            APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PLIST" 2>/dev/null || echo "<none>")
            DOMAINS=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.associated-domains" "$PLIST" 2>/dev/null || echo "<none>")

            echo "--- Profile $PROFILE_COUNT ---"
            echo "File: $(basename "$PROFILE")"
            echo "Name: $NAME"
            echo "UUID: $UUID"
            echo "Application identifier: $APPID"
            echo "Associated Domains:"
            echo "$DOMAINS"

            # Apple's provisioning profile may authorize Associated Domains
            # with "*" while the app target carries the specific applinks domains.
            if [ "$APPID" = "QX9HW7SCL2.com.yayeverybody.scrobble" ] && echo "$DOMAINS" | grep -Eq '(^|[[:space:]])(\*|applinks:yayeverybody\.com)($|[[:space:]])'; then
              FOUND="$PROFILE"
              echo "MATCH: This profile authorizes Associated Domains for Scrobble."
            fi
          done

          echo "=== End provisioning profile diagnostics ==="
          echo "Profiles inspected: $PROFILE_COUNT"

          APP_ENTITLEMENTS="ios/App/App/App.entitlements"
          test -f "$APP_ENTITLEMENTS" || {
            echo "ERROR: App.entitlements is missing"
            exit 1
          }
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.associated-domains" "$APP_ENTITLEMENTS" | grep -q "applinks:yayeverybody.com" || {
            echo "ERROR: App.entitlements does not contain applinks:yayeverybody.com"
            exit 1
          }
          echo "Verified app entitlement contains applinks:yayeverybody.com"

          test -n "$FOUND" || {
            echo "ERROR: No App Store profile for Scrobble authorizes Associated Domains"
            exit 1
          }
          echo "Verified Associated Domains in $(basename "$FOUND")"

      - name: Set up iOS code signing
        script: |
          cd scrobble-mobile
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd scrobble-mobile
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - scrobble-mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
